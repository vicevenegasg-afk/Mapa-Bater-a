<title>Mapa de batería</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: una columna, lista con líneas finas en vez de tarjetas; menús en hojas que suben desde abajo; vivo a pantalla completa en negro. Todo en Georgia. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F3; --fg:#141414; --muted:#8B8B87; --line:#E9E9E6;
  --ink:#141414; --ink-fg:#FFFFFF; --soft:#F5F5F3;
  --i0:#D6D6D2; --i1:#9AA3AE; --i2:#7F9CB8; --i3:#C2A35A; --i4:#D98A4E; --i5:#C8564A;
  --m-sil:currentColor; --m-fill:currentColor; --m-golpe:currentColor; --m-corte:currentColor; --m-platos:currentColor;
  --tint:0%;
  --serif:Georgia,"Times New Roman",serif;
  --f-display:var(--serif); --f-body:var(--serif); --f-mono:var(--serif);
  --bar-h:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F; --surface:#0F0F0F; --surface-2:#1A1A1A; --fg:#F1F1EE; --muted:#8E8E8A; --line:#262626;
  --ink:#F1F1EE; --ink-fg:#0F0F0F; --soft:#1A1A1A;
  --i0:#3A3A38; --i1:#8D96A2; --i2:#86A6C4; --i3:#D3B46A; --i4:#E59A5E; --i5:#DC6A5D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#0F0F0F; --surface-2:#1A1A1A; --fg:#F1F1EE; --muted:#8E8E8A; --line:#262626;
  --ink:#F1F1EE; --ink-fg:#0F0F0F; --soft:#1A1A1A;
  --i0:#3A3A38; --i1:#8D96A2; --i2:#86A6C4; --i3:#D3B46A; --i4:#E59A5E; --i5:#DC6A5D; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{touch-action:manipulation;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea{font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;width:100%}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--fg)}
button:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(34px,env(safe-area-inset-left,0px));padding-right:max(34px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-size:inherit}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;font-size:.95rem}
.btn.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.88rem}
.btn.danger{color:var(--i5)}
.btn[disabled]{opacity:.35}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
.iconbtn svg{width:22px;height:22px}
.iconbtn[disabled]{opacity:.3}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--i2);display:inline-block}
.sync.saving i{background:var(--i3)} .sync.local i{background:var(--i0)}

/* inicio */
.home-head{padding-block:34px 8px}
.home-head h1{font-size:2.6rem;line-height:1.05}
.home-head .sub{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:.9rem}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:6px 0}
.search input{font-size:1.05rem;padding:12px 0;font-style:italic}
.search input:not(:placeholder-shown){font-style:normal}
.songs{display:grid;grid-template-columns:minmax(0,1fr);padding-block:4px 130px}
.song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);width:100%}
.song h2{font-size:1.3rem;line-height:1.2;min-width:0}
.song .meta{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}
.song .meta span+span::before{content:"·";margin-right:12px;color:var(--line)}
.key{font-size:.95rem;color:var(--muted);font-style:italic}
.curve{display:flex;align-items:flex-end;gap:2px;height:14px;grid-column:1/-1;margin-top:8px}
.curve span{flex:1;border-radius:1px;min-width:2px}
.song.cat h2{color:var(--muted)}
.song.cat .meta span:last-child{color:var(--fg)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-style:italic}
.fab{position:fixed;right:max(28px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;padding:0;font-size:1.7rem;line-height:1;box-shadow:0 8px 24px rgb(0 0 0 / .16)}
.help{font-size:.82rem;color:var(--muted);font-style:italic}

/* canción */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .bar1{display:flex;align-items:center;gap:2px;padding-block:6px 0;margin-left:-10px;margin-right:-10px}
.top .bar1 .sp{flex:1}
.top .live{margin-right:10px}
.title{padding-block:4px 2px}
.title h1{font-size:2rem;line-height:1.1}
.metaline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:2px 10px;font-size:.85rem;color:var(--muted)}
.strip{display:flex;gap:3px;align-items:flex-end;height:26px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.strip button{flex:1;border-radius:1px;min-width:4px;opacity:.85}
.strip button.on{opacity:1;box-shadow:0 3px 0 -1px var(--fg)}
.shorthand{display:flex;gap:10px;align-items:center;padding-block:4px}
.shorthand input{font-size:.95rem}
.secs{display:grid;grid-template-columns:minmax(0,1fr);padding-block:0 calc(var(--bar-h) + 80px + env(safe-area-inset-bottom,0px))}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-bottom:1px solid var(--line);scroll-margin-top:170px;scroll-margin-bottom:170px;position:relative}
.sec.on{background:var(--soft);margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px;border-radius:14px;border-bottom-color:transparent}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;text-align:left;width:100%}
.sec-h .n{display:none}
.sec-h h3{font-size:1.35rem;line-height:1.15}
.sec-h .dsum{font-size:.85rem;color:var(--muted);white-space:nowrap}
.sec-h .dsum b{font-weight:400;color:var(--fg)}
.sec-h .ly{grid-column:1/-1;font-style:italic;color:var(--fg);opacity:.75;font-size:1.02rem;line-height:1.35;white-space:pre-line}
.dyn{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.dyn button{min-height:40px;padding:2px;border-radius:999px;font-size:.8rem;line-height:1.05;color:var(--muted);border:1px solid var(--line);background:var(--bg)}
.dyn button.on{color:var(--ink-fg);background:var(--ink)!important;border-color:var(--ink)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.85rem}
.chip svg{width:14px;height:14px;flex:none}
.chip small{color:var(--muted);font-style:italic;font-size:.85rem}
.note{font-size:.9rem;color:var(--muted);font-style:italic;white-space:pre-wrap}
.note-row{display:flex;gap:6px;align-items:flex-end}
.note-row textarea{min-height:40px;resize:none;font-size:.95rem;font-style:italic}
.sec-tools{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:2px -4px 0;justify-items:center}
.sec-tools .tb{width:100%;max-width:40px;height:auto;aspect-ratio:1;flex-direction:row;gap:0;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .08s,background .12s}
.sec-tools .tb svg{width:58%;height:58%}
.sec-tools .tb.pad svg{width:66%;height:66%}
.sec-tools .tb:nth-child(6){margin-left:2px}
.sec-tools .tb:active,.sec-tools .tb.hit{transform:scale(.92);background:var(--soft)}
.sec-tools .del-confirm{background:var(--i5);border-color:var(--i5);color:#fff}
.sec-tools small{font-size:.8rem;font-style:italic}
.sec-h{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sec-h .ly.auto{opacity:.45}
.sec.dragging{background:var(--bg);box-shadow:0 12px 32px rgb(0 0 0 / .18);border-radius:14px;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px;z-index:5;transform:scale(1.02);border-bottom-color:transparent}
.secs.drag-on .sec:not(.dragging){transition:transform .15s}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;font-size:.95rem;color:var(--fg)}
.back svg{width:20px;height:20px}
.addsec{padding:18px 0;color:var(--muted);font-style:italic;text-align:left}

/* barra de golpes */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{padding-block:6px 8px}
.bar .hint{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;color:var(--muted);padding:2px 0 4px;font-style:italic}
.bar .hint b{color:var(--fg);font-weight:400;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:2px -6px 0}
.pad{height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.74rem;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .12s,transform .08s;color:var(--fg)}
.pad svg{width:22px;height:22px}
.pad:active,.pad.hit{background:var(--soft);transform:scale(.95)}

/* hojas */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .32);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .12)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.sheet .wrap{display:grid;gap:14px;padding-block:14px 8px}
.sheet h2{font-size:1.5rem}
.menu{display:grid;border-top:1px solid var(--line)}
.menu button{text-align:left;padding:15px 0;border-bottom:1px solid var(--line);font-size:1.02rem;display:flex;justify-content:space-between;align-items:center}
.menu button[disabled]{opacity:.35}
.menu button.danger{color:var(--i5)}
.menu button.del-confirm{color:var(--i5);font-style:italic}
.menu button small{color:var(--muted);font-style:italic;font-size:.85rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{min-height:40px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.field{display:grid;gap:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.vers{display:grid;border-top:1px solid var(--line)}
.vers div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.help code{font-family:var(--serif);font-style:normal;color:var(--fg);background:var(--soft);padding:0 4px;border-radius:4px}
.del-confirm{color:var(--i5)}

.toast{z-index:70!important;position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(var(--bar-h) + 50px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 40px);display:flex;gap:14px;align-items:center}
.toast button{color:var(--ink-fg);text-decoration:underline;font-style:italic}

/* en vivo: negro, sin cajas, la parte actual en blanco y las siguientes atenuadas */
.stage{touch-action:manipulation;position:fixed;inset:0;z-index:60;background:#000;color:#FFF;font-family:var(--serif);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding:calc(10px + env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));user-select:none;-webkit-user-select:none;
  --i0:#555; --i1:#A9B2BE; --i2:#9DBBD8; --i3:#E2C47C; --i4:#F0A870; --i5:#F07D70}
.stage .st-top{display:flex;align-items:center;gap:8px;margin-right:-10px}
.stage .st-top .t{flex:1;min-width:0;font-size:.9rem;color:#8A8A8A;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage .x{width:44px;height:44px;border-radius:50%;color:#FFF;display:flex;align-items:center;justify-content:center}
.stage .x svg{width:20px;height:20px}
.stage .x.on{background:#FFF;color:#000}
.beat{width:8px;height:8px;border-radius:50%;background:#333;flex:none}
.beat.flash{background:#FFF}.beat.flash.one{background:var(--i5)}
.st-list{display:grid;grid-template-rows:repeat(3,auto);align-content:start;min-height:0;overflow:hidden}
.st-card{--c:var(--i0);display:flex;flex-direction:column;justify-content:flex-start;gap:6px;min-height:0;overflow:hidden;border-top:1px solid #222;padding-block:16px 18px;opacity:.62}
.st-card:first-child{border-top:0;padding-top:20px}
.st-card.now{opacity:1}
.st-card.end{opacity:.25}
.st-head{display:flex;align-items:baseline;gap:12px;min-width:0}
.st-tag{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#888;flex:none}
.st-nm{font-size:clamp(1.8rem,8vw,3rem);line-height:1;letter-spacing:-.01em;overflow-wrap:anywhere}
.st-card.now .st-nm{font-size:clamp(2.6rem,12vw,4.6rem);line-height:1}
.st-dyn{display:flex;align-items:center;gap:10px}
.st-dyn b{font-weight:400;font-style:italic;font-size:clamp(1.2rem,5.5vw,1.9rem);line-height:1;color:var(--c)}
.st-card.now .st-dyn b{font-size:clamp(1.5rem,7vw,2.4rem)}
.st-sym{font-size:clamp(1.4rem,6vw,1.9rem);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.st-card.now .st-sym{font-size:clamp(1.8rem,8vw,2.5rem)}
.st-marks{display:flex;flex-wrap:wrap;gap:4px 16px}
.st-mark{display:inline-flex;align-items:center;gap:7px;font-size:clamp(1.05rem,4.6vw,1.45rem)}
.st-mark svg{width:.9em;height:.9em;flex:none}
.st-mark small{color:#999;font-style:italic}
.st-ly{font-size:clamp(1.1rem,4.8vw,1.5rem);font-style:italic;color:#D8D8D8;line-height:1.3;white-space:pre-line}
.st-note{font-size:clamp(.95rem,4vw,1.15rem);color:#9A9A9A}
.metaline{width:100%;text-align:left}
.metaline .edit{margin-left:auto;color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-style:italic}
.tempo{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.tempo input{text-align:center;font-size:1.6rem;border-bottom:1px solid var(--line)}
.tempo .iconbtn{border:1px solid var(--line);font-size:1.3rem}
.tempo-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.metro-dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .05s}
.metro-dot.on{background:var(--fg)}.metro-dot.on.one{background:var(--i5)}
.st-prog{display:flex;gap:2px;align-items:flex-end;height:34px;margin:6px 0 4px}
.st-prog button{flex:1;min-width:3px;border-radius:1px;opacity:.55;position:relative}
.st-prog button.past{opacity:.22}
.st-prog button.cur{opacity:1;box-shadow:0 4px 0 -1px #FFF}
.st-hint{font-size:.72rem;color:#555;font-style:italic;margin-top:6px}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}

/* ===== Escarcha: vidrio claro esmerilado (elegido 2026-11-26) ===== */
:root{
  --i0:#DCD8E4; --i1:#AEB9CF; --i2:#8DB0DD; --i3:#A897E6; --i4:#F2A27F; --i5:#E8708F;
  --glass:rgb(255 255 255 / .52); --glass-hi:rgb(255 255 255 / .72); --glass-bd:rgb(255 255 255 / .8);
  --glass-sh:0 6px 24px rgb(80 60 120 / .08), inset 0 1px 0 rgb(255 255 255 / .9);
  --bar-glass:rgb(250 247 252 / .55); --muted:#6E6A7C; --line:rgb(120 110 150 / .16);
  --mesh:radial-gradient(60% 40% at 12% 6%,#FFD9C7 0,transparent 70%),radial-gradient(55% 40% at 96% 30%,#DCD5FF 0,transparent 70%),radial-gradient(60% 45% at 15% 88%,#CBE8F6 0,transparent 70%),radial-gradient(45% 35% at 90% 95%,#FFE3EC 0,transparent 70%),#F6F2F0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --i0:#4A4658; --i1:#BAC4DA; --i2:#9DC0EE; --i3:#B9AAF6; --i4:#FFB48F; --i5:#FF84A2;
  --glass:rgb(255 255 255 / .07); --glass-hi:rgb(255 255 255 / .13); --glass-bd:rgb(255 255 255 / .14);
  --glass-sh:inset 0 1px 0 rgb(255 255 255 / .1); --bar-glass:rgb(16 14 24 / .5); --muted:#A29EB4; --line:rgb(255 255 255 / .1);
  --mesh:radial-gradient(60% 40% at 12% 6%,#4A2F3A 0,transparent 70%),radial-gradient(55% 40% at 96% 30%,#322A63 0,transparent 70%),radial-gradient(60% 45% at 15% 88%,#173E55 0,transparent 70%),#100E17;
  --bg:#100E17 }}
:root[data-theme="dark"]{
  --i0:#4A4658; --i1:#BAC4DA; --i2:#9DC0EE; --i3:#B9AAF6; --i4:#FFB48F; --i5:#FF84A2;
  --glass:rgb(255 255 255 / .07); --glass-hi:rgb(255 255 255 / .13); --glass-bd:rgb(255 255 255 / .14);
  --glass-sh:inset 0 1px 0 rgb(255 255 255 / .1); --bar-glass:rgb(16 14 24 / .5); --muted:#A29EB4; --line:rgb(255 255 255 / .1);
  --mesh:radial-gradient(60% 40% at 12% 6%,#4A2F3A 0,transparent 70%),radial-gradient(55% 40% at 96% 30%,#322A63 0,transparent 70%),radial-gradient(60% 45% at 15% 88%,#173E55 0,transparent 70%),#100E17;
  --bg:#100E17 }
body{background:transparent;margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec.on{box-shadow:0 12px 34px rgb(0 0 0 / .35),inset 0 1px 0 rgb(255 255 255 / .14)}}
:root[data-theme="dark"] .sec.on{box-shadow:0 12px 34px rgb(0 0 0 / .35),inset 0 1px 0 rgb(255 255 255 / .14)}
html{background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh)}
body::before{background:var(--bar-glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.frost{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh)}
/* barras fijas translúcidas */
.top,.search{background:var(--bar-glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.top{border-bottom:1px solid var(--glass-bd)}
.strip{border-bottom:0}
.strip button{border-radius:3px}
/* lista de canciones como tarjetas de vidrio */
.songs{gap:10px;padding-top:10px}
.song{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh);border-radius:20px;padding:14px 18px;margin:0 -12px;width:auto}

  let raw = null;
  try { raw = localStorage.getItem(CACHE_KEY); if (raw) { const o = JSON.parse(raw); songs = o.songs || {}; (o.dirty || []).forEach(id => dirty.add(id)); } } catch(e) {}
  /* versión instalada: la primera vez trae las canciones que había en Claude */
  Object.values(songs).forEach(normSong);
  if (!raw && Array.isArray(window.MAPA_SEED)) { window.MAPA_SEED.forEach(x => { if (x && x.id && Array.isArray(x.secciones)) songs[x.id] = normSong(JSON.parse(JSON.stringify(x))); }); saveCache(); }
  try { const u = JSON.parse(localStorage.getItem(UI_KEY) || "null"); if (u && u.songId && songs[u.songId]) { ui.screen = u.screen === "song" ? "song" : "home"; ui.songId = u.songId; ui.active = u.active || null; } } catch(e) {}
}
function saveUi(){ try { localStorage.setItem(UI_KEY, JSON.stringify({screen:ui.screen, songId:ui.songId, active:ui.active})); } catch(e) {} }
function saveCache(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({songs, dirty:[...dirty]})); } catch(e) {}
}
function setSync(state){ const el = document.getElementById("sync"); if (!el) return;
  el.className = "sync " + state;
  el.lastChild.textContent = state === "saving" ? "Guardando…" : state === "local" ? "Guardado en este teléfono" : "Guardado";
}
function syncState(){ return mode === "local" ? "local" : dirty.size ? "saving" : "ok"; }

function touch(song){
  song.actualizado = Date.now();
  dirty.add(song.id); saveCache();
  setSync(syncState());
  clearTimeout(writeTimer); writeTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!db) { setSync(syncState()); return; }
  for (const id of [...dirty]) {
    const ref = db.collection("canciones").doc(id);
    try {
      if (songs[id]) await ref.set(JSON.parse(JSON.stringify(songs[id])));
      else await ref.delete();
      dirty.delete(id); synced.add(id);
    } catch(e) {
      if (e && e.code === "unavailable") { setTimeout(flush, 4000 + Math.random()*2000); break; }
      if (e && (e.code === "revoked" || e.code === "not_granted")) { db = null; mode = "local"; break; }
      toast("No se pudo guardar en la nube. Queda guardado en este teléfono.");
      break;
    }
  }
  saveCache(); setSync(syncState());
}
function snap(song){ (undo[song.id] ||= []).push(JSON.stringify(song.secciones)); if (undo[song.id].length > 40) undo[song.id].shift(); }

async function initDb(){
  try {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  } catch(e) { db = null; }
  if (!db) { mode = "local"; render(); return; }
  mode = "cloud";
  const timeout = setTimeout(() => { if (!dbReady) { mode = "local"; render(); } }, 10000);
  db.collection("canciones").onSnapshot(qs => {
    clearTimeout(timeout); dbReady = true; mode = "cloud";
    const remote = new Set();
    qs.docs.forEach(d => {
      remote.add(d.id); synced.add(d.id);
      if (dirty.has(d.id)) return;
      const data = d.data(); if (!data) return;
      const local = songs[d.id];
      if (!local || (data.actualizado || 0) >= (local.actualizado || 0)) songs[d.id] = normSong({...JSON.parse(JSON.stringify(data)), id:d.id}); // copia editable: los datos de la nube llegan congelados
    });
    for (const id of Object.keys(songs)) {
      if (!remote.has(id) && !dirty.has(id)) {
        if (synced.has(id)) delete songs[id]; else dirty.add(id);
      }
    }
    saveCache();
    if (dirty.size) flush();
    if (!document.querySelector("textarea:focus,input:focus")) render(); else setSync(syncState());
  }, err => { clearTimeout(timeout); mode = "local"; render(); });
}

/* reloj de pulso preciso: programa los clics con el reloj de audio, no con setInterval */
const clock = {timer:null, next:0, n:0, bpm:0, per:4, onBeat:null, sound:() => true};
function audioSessionPlayback(on){ try { if (navigator.audioSession) navigator.audioSession.type = on ? "playback" : "auto"; } catch(e) {} }

/* metrónomo de prueba mientras se ajusta el tempo */

/* ---------- acciones ---------- */
function toast(msg, undoable){

  t.innerHTML = `<span>${esc(msg)}</span>${undoable ? `<button data-act="undo">Deshacer</button>` : ""}`;

function addMark(type, withNote){

  snap(song); (s.marcas ||= []).push({t:type}); touch(song);

/* si una parte no tiene letra, toma la de otra parte del mismo tipo (Coro, Verso…) */
function letraDe(song, s){
  if (s.letra) return {txt:s.letra, auto:false};
  if (s.div) return {txt:"", auto:false};
  const key = norm(splitName(s.nombre).tipo);
  const same = song.secciones.filter(x => x.letra && !x.div && norm(splitName(x.nombre).tipo) === key);
  const i = song.secciones.indexOf(s);
  const prev = same.filter(x => song.secciones.indexOf(x) < i).pop();
  const src = prev || same[0];
  return src ? {txt:src.letra, auto:true} : {txt:"", auto:false};
}
function closeSheet(){
  const sh = ui.sheet, song = S();
  if (sh && sh.type === "mark" && song) { const s = sec(song, sh.sid), m = s && s.marcas[sh.mi]; if (m && isNote(m) && !String(m.txt || "").trim()) { s.marcas.splice(sh.mi, 1); if (sh.isNew) undo[song.id]?.pop(); touch(song); } }

}
function newSection(nombre){ return {id:uid(), nombre, letra:"", int:0, marcas:[], nota:""}; }
/* numeración automática: "Coro", "Coro", "Coro" se muestran como Coro 1, Coro 2, Coro 3 según el orden */
function splitName(n){ const m = String(n || "").trim().match(/^([A-Za-zÁÉÍÓÚÑáéíóúñü-]+)\s*\d*\s*(.*)$/); return m ? {tipo:m[1], resto:m[2]} : {tipo:String(n || ""), resto:""}; }
function lbl(song, s){
  const secs = song.secciones, {tipo, resto} = splitName(s.nombre), key = norm(tipo);
  let i = secs.indexOf(s), h = i; while (h > 0 && secs[h].div) h--;
  const head = secs[h] || s;
  const same = secs.filter(x => !x.div && norm(splitName(x.nombre).tipo) === key);
  let base = same.length < 2 ? tipo : `${tipo} ${same.indexOf(head) + 1}`;
  if (s.div || secs[h + 1]?.div) base += (same.length < 2 ? " " : "") + String.fromCharCode(97 + Math.max(0, i - h));
  return base + (resto ? " " + resto : "");
}
const CHORD = /^[\(\[]?[A-G](?:#|b)?(?:m|maj|M|dim|aug|sus|add)?\d*(?:sus\d*|add\d*|b\d+|#\d+|M\d*)*(?:\/[A-G](?:#|b)?)?[\)\]]?$/;
const isChordLine = l => { const t = l.replace(/[()\[\]]/g, " ").replace(/[–—\-|/x×\d]+(?=\s|$)/g, " ").trim().split(/\s+/).filter(Boolean); return t.length > 0 && t.every(w => CHORD.test(w)); };

function parseLyrics(text){
  const paras = String(text || "").replace(/\r/g, "").replace(/[\u200b\u00a0]/g, " ").split(/\n\s*\n/).map(p => p.split("\n").map(l => l.trim()).filter(l => l && !isChordLine(l))).filter(p => p.length);
  const count = {};
  return paras.map((lines, i) => {
    let nombre = "";
    if (LABEL.test(lines[0])) nombre = lines.shift().replace(/:\s*$/, "").trim();
    else if (/^[^:]{2,20}:\s*\S/.test(lines[0]) && LABEL.test(lines[0].split(":")[0])) { const [a, ...b] = lines[0].split(":"); nombre = a.trim(); lines[0] = b.join(":").trim(); }
    nombre = nombre ? nombre.charAt(0).toUpperCase() + nombre.slice(1).toLowerCase() : `Parte ${i + 1}`;
    const s = newSection(nombre); s.letra = lines.filter(Boolean).join("\n"); return s;
  });
}
function textSummary(song){

  const lines = song.secciones.map((s, i) => {
    const mk = marksSorted(s).map(markText).join("; ");
    return `${i + 1}. ${lbl(song, s)} — ${DYN[s.int || 0]}${mk ? ` — ${mk}` : ""}`;
  });
  return [head, ...lines].join("\n");

const SH_TYPES = {i:"intro", v:"verso", pc:"pre", c:"coro", p:"puente", s:"solo", f:"final", o:"outro", in:"instrumental"};
function applyShorthand(text){
  const song = S(); if (!song) return;
  const toks = text.match(/(?:[^\s"]+:"[^"]*"|"[^"]*"|\S+)/g) || [];
  let target = sec(song, ui.active), changes = [];
  snap(song);
  for (let tok of toks) {
    const lt = norm(tok);
    let m;
    if ((m = lt.match(/^#(\d+)$/))) { const t = song.secciones[+m[1] - 1]; if (t) target = t; else return toast(`No existe la sección ${m[1]}`); continue; }
    m = lt.match(/^(pc|in|i|v|c|p|s|f|o)(\d*)$/);
    if (m && !(m[2] === "" && (lt === "p" || lt === "f"))) {
      const word = SH_TYPES[m[1]], nth = +(m[2] || 1);
      const found = song.secciones.filter(s => norm(s.nombre).startsWith(word) || (m[1] === "f" && norm(s.nombre).startsWith("outro")));
      if (found[nth - 1]) { target = found[nth - 1]; continue; }
      return toast(`No encontré "${tok}" en esta canción`);
    }
    if (lt === "puente" || lt === "final") { const f = song.secciones.find(s => norm(s.nombre).startsWith(lt)); if (f) { target = f; continue; } }
    if (!target) return toast("Primero elige una sección");
    const dynI = {mudo:1, "en-silencio":1, cerrado:2, acomp:3, acompanamiento:3, build:4, buildup:4, "build-up":4, abierto:5, pp:1, p:2, mf:3, f:4, ff:5}[lt];
    if (dynI) { target.int = dynI; changes.push(`${lbl(song, target)}: ${DYN[dynI]}`); continue; }
    if ((m = tok.match(/^nota:"?([^"]*)"?$/i))) { (target.marcas ||= []).push({t:"nota", txt:m[1]}); changes.push(`${lbl(song, target)}: nota`); continue; }
    if ((m = tok.match(/^(?:(ini|med|fin)-)?([a-záéíóú>]+)(?:-(ini|med|fin))?(?::"?([^"]*)"?)?$/i))) {
      const key = {sil:"sil", silencio:"sil", fill:"fill", golpe:"golpe", acento:"golpe", ">":"golpe", corte:"corte", stop:"corte", platos:"platos", aro:"platos", plato:"platos"}[norm(m[2])];
      if (key) { (target.marcas ||= []).push({t:key, ...(m[4] ? {txt:m[4]} : {})}); changes.push(`${lbl(song, target)}: ${MARKS[key].lbl}${m[4] ? " (" + m[4] + ")" : ""}`); continue; }
    }
    toast(`No entendí "${tok}"`); undo[song.id].pop(); return;
  }
  if (!changes.length) { undo[song.id].pop(); if (target) { ui.active = target.id; render(); scrollToActive(); } return; }
  ui.active = target.id; touch(song); render(); scrollToActive();
  toast(changes.slice(-2).join(" · "), true);
  setTimeout(() => document.getElementById("shortIn")?.focus(), 0);
}

$app.addEventListener("submit", e => {
  if (e.target.dataset.form === "short") { e.preventDefault(); const v = e.target.querySelector("input").value.trim(); if (v) applyShorthand(v); }
});

document.addEventListener("click", e => {
  if (ui.live && !e.target.closest(".toast,.sheet,.scrim")) return;
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, song = S(), sid = b.dataset.sid;
  if (a !== "delSec" && a !== "delSong") ui.confirmDel = null;
  if (b.closest("[data-menu]") && !["delSec","delSong","copyText"].includes(a)) ui.sheet = null;
  switch (a) {
    case "open": ui.screen = "song"; ui.songId = b.dataset.id; ui.active = null; ui.shorthand = false; render(); window.scrollTo(0,0); break;
    case "home": ui.screen = "home"; ui.sheet = null; render(); break;
    case "addCat": {
      const c = CATALOGO[+b.dataset.i], id = uid();
      songs[id] = {id, titulo:c[0], tono:c[1], bpm:"", compas:"4/4", pagina:String(c[2]), nota:"Estructura genérica: ajústala o pega la letra con Editar.", orden:Date.now(), versiones:[],
        secciones:["Intro","Verso","Coro","Verso","Coro","Puente","Coro","Final"].map(newSection)};
      fb("add"); touch(songs[id]); ui.q = ""; ui.screen = "song"; ui.songId = id; ui.active = null; render(); window.scrollTo(0,0); toast(`${c[0]} agregada`); break;
    }
    case "newSong": ui.sheet = {type:"song", isNew:true}; render(); setTimeout(() => document.getElementById("fTit")?.focus(), 50); break;
    case "editSec": ui.sheet = {type:"sec", sid}; render(); break;
    case "pick":
      if (ui.active !== sid) { sfx("nav"); haptic(); } ui.active = sid; render(); scrollToActive(); break;
    case "int": { const s = sec(song, sid), v = +b.dataset.v; snap(song); s.int = s.int === v ? 0 : v; fb(s.int ? "dyn" : "off", s.int); ui.active = sid; touch(song); render(); break; }
    case "mark": ui.active = sid; ui.sheet = {type:"mark", sid, mi:+b.dataset.mi}; render(); break;
    case "mType": { const s = sec(song, ui.sheet.sid), m = s.marcas[ui.sheet.mi]; const ta = document.getElementById("mTxt"); if (ta) m.txt = ta.value.trim(); m.t = (m.t === b.dataset.v && b.dataset.v !== "nota") ? "nota" : b.dataset.v; haptic(); touch(song); render(); break; }
    case "addNote": { const s0 = sec(song, sid); snap(song); s0.marcas.push({t:"nota", txt:""}); ui.active = sid; ui.sheet = {type:"mark", sid, mi:s0.marcas.length - 1, isNew:true}; haptic(); render(); break; }
    case "kw": { const ta = document.getElementById("mTxt"); if (!ta) break; const w = b.dataset.v, foc = document.activeElement === ta;
      const st = foc ? ta.selectionStart : ta.value.length, en = foc ? ta.selectionEnd : ta.value.length;
      const before = ta.value.slice(0, st), after = ta.value.slice(en), pre = before && !/\s$/.test(before) ? " " : "";
      ta.value = before + pre + w + " " + after.replace(/^\s+/, ""); const pos = (before + pre + w + " ").length;
      if (foc) try { ta.setSelectionRange(pos, pos); } catch(err) {}
      ta.dispatchEvent(new Event("input", {bubbles:true})); sfx("nav"); haptic(); break; }
    case "split": { const i = song.secciones.findIndex(x => x.id === sid), s0 = song.secciones[i]; snap(song);
      const ns = {...newSection(s0.nombre), int:s0.int || 0, div:true}; song.secciones.splice(i + 1, 0, ns); ui.active = ns.id; fb("add"); touch(song); render(); scrollToActive();
      toast(`Dividida en ${lbl(song, s0)} y ${lbl(song, ns)}`, true); break; }
    case "mDel": { fb("del"); const s = sec(song, ui.sheet.sid); snap(song); s.marcas.splice(ui.sheet.mi, 1); ui.sheet = null; touch(song); render(); toast("Golpe quitado", true); break; }
    case "closeSheet": closeSheet(); break;
    case "noop": break;
    case "undo": { const st = undo[song?.id]; if (!st?.length) break; fb("undo"); song.secciones = JSON.parse(st.pop()); ui.sheet = null; touch(song); render(); document.querySelector(".toast")?.remove(); break; }
    case "dup": { fb("add"); const i = song.secciones.findIndex(s => s.id === sid); snap(song); const c = JSON.parse(JSON.stringify(song.secciones[i])); c.id = uid(); song.secciones.splice(i + 1, 0, c); ui.active = c.id; touch(song); render(); scrollToActive(); toast(`${lbl(song, c)} agregada`, true); break; }
    case "up": case "down": { const i = song.secciones.findIndex(s => s.id === sid), j = a === "up" ? i - 1 : i + 1; if (j < 0 || j >= song.secciones.length) break; snap(song); [song.secciones[i], song.secciones[j]] = [song.secciones[j], song.secciones[i]]; touch(song); render(); scrollToActive(); break; }
    case "delSec": if (ui.confirmDel !== sid) { haptic(); ui.confirmDel = sid; render(); toast("Toca otra vez para borrar la parte"); break; }
      { fb("del"); const i = song.secciones.findIndex(s => s.id === sid); snap(song); if (!song.secciones[i].div && song.secciones[i + 1]?.div) song.secciones[i + 1].div = false; song.secciones.splice(i, 1); ui.confirmDel = null; ui.active = song.secciones[Math.min(i, song.secciones.length - 1)]?.id; touch(song); render(); toast("Parte borrada", true); } break;
    case "quickName": document.getElementById("secName").value = b.dataset.v; break;
    case "saveSec": { fb("ok"); const s = sec(song, ui.sheet.sid); snap(song); { const v = document.getElementById("secName").value.trim(); if (v) { const sp = splitName(v); s.nombre = sp.resto ? `${sp.tipo} ${sp.resto}` : sp.tipo; } } s.letra = document.getElementById("secLy").value.trim(); ui.sheet = null; touch(song); render(); break; }
    case "addAfter": case "addSec": { fb("add"); snap(song); const ns = newSection(a === "addAfter" ? splitName(sec(song, sid).nombre).tipo : "Coro"); let i = a === "addAfter" ? song.secciones.findIndex(s => s.id === sid) + 1 : song.secciones.length; while (a === "addAfter" && song.secciones[i]?.div) i++; song.secciones.splice(i, 0, ns); ui.active = ns.id; ui.sheet = {type:"sec", sid:ns.id}; touch(song); render(); break; }
    case "more": ui.sheet = {type:"more"}; render(); break;
    case "appMenu": ui.sheet = {type:"app"}; render(); break;
    case "togSound": prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) sfx("ok"); render(); break;
    case "togVib": prefs.vib = !prefs.vib; savePrefs(); haptic(); render(); break;
    case "exportData": exportBackup(); break;
    case "importData": importBackup(); break;
    case "bpmStep": { const inp = document.getElementById("fBpm"); const v = (parseInt(inp.value, 10) || 100) + +b.dataset.v; inp.value = Math.min(300, Math.max(30, v)); if (metro) metroStart(); break; }
    case "bpmPlay": if (metro) metroStop(); else metroStart(); metroButton(); break;
    case "bpmTap": { const t = performance.now(); taps = taps.filter(x => t - x < 2500); taps.push(t); clickSound(taps.length === 1);
      if (taps.length >= 3) { const d = (taps[taps.length - 1] - taps[0]) / (taps.length - 1); document.getElementById("fBpm").value = Math.round(60000 / d); if (metro) metroStart(); }
      b.textContent = taps.length >= 3 ? `Marcando… ${document.getElementById("fBpm").value}` : "Sigue tocando…"; break; }
    case "editSong": ui.sheet = {type:"song"}; render(); break;
    case "saveSong": {
      const tit = document.getElementById("fTit").value.trim(); if (!tit) { toast("Ponle un título"); break; }
      const data = {titulo:tit, tono:document.getElementById("fTono").value.trim(), bpm:parseInt(document.getElementById("fBpm").value, 10) || "", compas:document.getElementById("fComp").value.trim(), pagina:document.getElementById("fPag").value.trim()};
      if (ui.sheet.isNew) {
        const est = document.getElementById("fEst").value.split(",").map(x => x.trim()).filter(Boolean);
        const fromLyrics = parseLyrics(document.getElementById("fLetra").value);
        const id = uid(); songs[id] = {id, ...data, nota:"", orden:Date.now(), secciones:fromLyrics.length ? fromLyrics : (est.length ? est : ["Intro"]).map(newSection), versiones:[]};
        ui.screen = "song"; ui.songId = id; ui.active = null; touch(songs[id]);
      } else { Object.assign(song, data); touch(song); }
      fb("ok"); ui.sheet = null; render(); break;
    }
    case "copyText": {
      const txt = textSummary(song), box = document.getElementById("copyBox");
      const fallback = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); toast("Selecciona y copia el texto"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Mapa copiado. Pégalo en el grupo de la banda."), fallback); } catch(err) { fallback(); }
      break;
    }
    case "saveVer": {
      const d = new Date(), fecha = d.toISOString();
      const nombre = "Ensayo " + d.toLocaleDateString("es-CL", {weekday:"short", day:"numeric", month:"short"}) + " " + d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
      (song.versiones ||= []).push({fecha, nombre, secciones:JSON.parse(JSON.stringify(song.secciones))});
      if (song.versiones.length > 12) song.versiones.shift();
      fb("ok"); touch(song); render(); toast("Versión guardada"); break;
    }
    case "restoreVer": { const v = song.versiones.find(x => x.fecha === b.dataset.v); if (!v) break; snap(song); song.secciones = JSON.parse(JSON.stringify(v.secciones)); ui.sheet = null; touch(song); render(); toast(`Restaurada: ${v.nombre}`, true); break; }
    case "delSong": if (ui.confirmDel !== "song") { ui.confirmDel = "song"; render(); break; }
      delete songs[song.id]; dirty.add(song.id); ui.confirmDel = null; ui.sheet = null; ui.screen = "home"; saveCache(); clearTimeout(writeTimer); writeTimer = setTimeout(flush, 300); render(); break;
    case "toggleShort": ui.shorthand = !ui.shorthand; render(); if (ui.shorthand) setTimeout(() => document.getElementById("shortIn")?.focus(), 30); break;
    case "live": openLive(); break;
    case "dictNote": startDict(document.getElementById("note-" + sid), b); break;
    case "dictMark": startDict(document.getElementById("mTxt"), b); break;
  }
});

/* notas y detalle: se guardan al escribir, sin redibujar */
document.addEventListener("input", e => {
  if (e.target.id === "fBpm" || e.target.id === "fComp") { if (metro && metroBpm()) metroStart(); return; }
  if (e.target.id === "q") { ui.q = e.target.value; document.getElementById("list").innerHTML = listHtml(); return; }
  const t = e.target, song = S(); if (!song) return;
  if (t.dataset.note) { const s = sec(song, t.dataset.note); s.nota = t.value; touch(song); }
  if (t.id === "mTxt" && ui.sheet?.type === "mark") { const m = sec(song, ui.sheet.sid).marcas[ui.sheet.mi]; m.txt = t.value.trim(); touch(song); }
});

/* botones de golpe: toque = agregar, mantener = agregar y escribir nota */
let press = null;
document.addEventListener("pointerdown", e => {
  const p = e.target.closest("[data-pad]"); if (!p || ui.live) return;
  p.classList.add("hit");
  press = {el:p, t:p.dataset.pad, x:e.clientX, y:e.clientY, fired:false, timer:setTimeout(() => { press.fired = true; addMark(press.t, true); }, 450)};
});
const endPress = cancel => e => {
  if (!press) return; clearTimeout(press.timer); press.el.classList.remove("hit");
  const moved = e && e.clientX != null && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 14;
  if (!cancel && !press.fired && !moved && e.target.closest("[data-pad]") === press.el) addMark(press.t, false);
  press = null;
};
document.addEventListener("pointerup", e => { if (press && press.fired) swallowUntil = Date.now() + 700; endPress(false)(e); });
/* tras mantener presionado, el toque al soltar no debe cerrar la hoja que se abrió */
let swallowUntil = 0;
document.addEventListener("click", e => { if (e.target.closest?.(".hap")) { e.stopPropagation(); return; } if (Date.now() < swallowUntil) { swallowUntil = 0; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener("pointercancel", endPress(true));
/* mover partes: mantener presionado el nombre y desplazar */
let drag = null;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest?.(".sec-h"); if (!h || ui.live || ui.screen !== "song") return;
  if (drag) { clearTimeout(drag.timer); drag = null; }
  const secEl = h.closest(".sec");
  drag = {secEl, x:e.clientX, y:e.clientY, on:false, timer:setTimeout(() => {
    drag.on = true; secEl.classList.add("dragging"); secEl.parentElement.classList.add("drag-on");
    document.addEventListener("touchmove", dragTouchMove, {passive:false});
    fb("drag");
  }, 380)};
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { clearTimeout(drag.timer); drag = null; } return; }
  dragTo(e.clientY);
});
/* solo se escucha touchmove mientras se arrastra, para no afectar el scroll ni los toques normales */
function dragTouchMove(e){ if (!drag?.on) return; e.preventDefault(); const t = e.touches[0]; if (t) dragTo(t.clientY); }
function dragTo(y){
  const box = drag.secEl.parentElement;
  const others = [...box.querySelectorAll(".sec")].filter(x => x !== drag.secEl);
  const next = others.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
  const ref = next || box.querySelector(".addsec");
  if (drag.secEl.nextElementSibling !== ref) box.insertBefore(drag.secEl, ref);
  if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 110) window.scrollBy(0, 12);
}
function endDrag(){
  if (!drag) return; clearTimeout(drag.timer);
  const d = drag; drag = null; if (!d.on) return;
  document.removeEventListener("touchmove", dragTouchMove, {passive:false});
  swallowUntil = Date.now() + 350;
  const song = S(); const box = d.secEl.parentElement;
  box.classList.remove("drag-on"); d.secEl.classList.remove("dragging");
  if (!song) return;
  const order = [...box.querySelectorAll(".sec")].map(x => x.dataset.sid);
  if (order.join() === song.secciones.map(x => x.id).join()) return;
  snap(song);
  song.secciones = order.map(id => song.secciones.find(x => x.id === id)).filter(Boolean);
  ui.active = d.secEl.dataset.sid;
  sfx("nav"); haptic(); touch(song); render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", () => { if (drag && !drag.on) { clearTimeout(drag.timer); drag = null; } });
document.addEventListener("touchend", () => { if (drag) endDrag(); }, {passive:true});
document.addEventListener("contextmenu", e => { if (e.target.closest(".sec-h")) e.preventDefault(); });

document.addEventListener("contextmenu", e => { if (e.target.closest("[data-pad]")) e.preventDefault(); });
document.addEventListener("mousedown", e => { if (e.target.closest('[data-act="kw"]')) e.preventDefault(); });

/* dictado (si el navegador lo permite) */
let dict = null, dictOn = null;
function startDict(input, btn){
  if (!dict || !input) return;
  if (dictOn) { dict.stop().catch(() => {}); return; }
  const base = input.value ? input.value.replace(/\s*$/, " ") : "";
  let acc = "";
  dictOn = {input};
  btn.style.background = "var(--i5)"; btn.style.color = "#fff";
  const offs = [
    dict.onPartial(({text}) => { input.value = base + acc + text; }),
    dict.onFinal(({text}) => { acc += text + " "; input.value = base + acc; input.dispatchEvent(new Event("input", {bubbles:true})); }),
    dict.onState(({state}) => { if (state === "idle") { offs.forEach(f => f && f()); dictOn = null; btn.style.background = ""; btn.style.color = ""; } })
  ];
  dict.start({language:"es"}).catch(err => { offs.forEach(f => f && f()); dictOn = null; btn.style.background = ""; btn.style.color = "";
    if (err && err.code === "not_granted") { dict = null; render(); } else if (err && err.code !== "dismissed") toast("No se pudo dictar. Usa el micrófono del teclado."); });
}

/* ---------- respaldo ---------- */
async function exportBackup(){
  const now = new Date(), name = `mapa-bateria-${now.toISOString().slice(0, 10)}.json`;
  const data = {app:"mapa-bateria", formato:1, fecha:now.toISOString(), canciones:songList()};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const done = () => { prefs.lastBackup = Date.now(); savePrefs(); fb("ok"); if (ui.sheet?.type === "app") render(); toast(`Respaldo listo: ${data.canciones.length} canciones`); };
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Respaldo Mapa de batería"}); done(); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); done();
  } catch(e) { toast("No se pudo exportar el respaldo"); }
}
function importBackup(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json,text/plain"; inp.style.display = "none";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      const list = (Array.isArray(o) ? o : o.canciones || []).filter(x => x && x.titulo && Array.isArray(x.secciones));
      if (!list.length) { toast("Ese archivo no tiene canciones"); return; }
      let nuevas = 0;
      list.forEach(x => { const id = x.id || uid(); if (!songs[id]) nuevas++; songs[id] = normSong({...JSON.parse(JSON.stringify(x)), id}); touch(songs[id]); });
      ui.sheet = null; ui.screen = "home"; render(); fb("ok");
      toast(`Importadas ${list.length} canciones (${nuevas} nuevas)`);
    } catch(e) { toast("No pude leer el archivo de respaldo"); }
  });
  document.body.appendChild(inp); inp.click();
}

/* ---------- deslizar la parte activa para pasar a la siguiente o anterior ---------- */
let swipe = null;
document.addEventListener("touchstart", e => {
  const c = e.target.closest?.(".sec.on"); if (!c || ui.live || ui.sheet || e.touches.length > 1 || e.target.closest("textarea,input")) { swipe = null; return; }
  const t = e.touches[0]; swipe = {x:t.clientX, y:t.clientY, t:Date.now()};
}, {passive:true});
document.addEventListener("touchend", e => {
  if (!swipe || drag) { swipe = null; return; }
  const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y, dt = Date.now() - swipe.t; swipe = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2 || dt > 700) return;
  if (press) { clearTimeout(press.timer); press.el.classList.remove("hit"); press = null; }
  swallowUntil = Date.now() + 400;
  songStep(dx < 0 ? 1 : -1);
}, {passive:true});
function songStep(d){
  const song = S(); if (!song) return;
  const i = song.secciones.findIndex(x => x.id === ui.active), j = i + d;
  if (j < 0 || j >= song.secciones.length) { haptic(); return; }
  ui.active = song.secciones[j].id; sfx("nav"); haptic(); render(); scrollToActive();
  const el = document.getElementById("s-" + ui.active); if (el) el.classList.add(d > 0 ? "in-next" : "in-prev");
}

window.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty.size) flush(); });
window.addEventListener("online", () => dirty.size && flush());
window.addEventListener("error", e => toast("Algo falló: " + (e.message || "error") + ". Avísale a Claude."));

/* inicio */
loadCache();
if (Object.keys(songs).length) mode = "loading";
render(); setSync(syncState());
try { navigator.storage?.persist?.(); } catch(e) {}
initDb();
(async () => { try { dict = window.claude && window.claude.use ? await window.claude.use("dictation") : null; } catch(e) { dict = null; } if (dict && ui.screen === "song" && !document.activeElement?.matches("textarea,input")) render(); })();
// mantener la etiqueta de guardado al día
new MutationObserver(() => setSync(syncState())).observe($app, {childList:true});
})();
